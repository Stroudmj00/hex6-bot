[autopilot]
name = "hex6_colab_autopilot"
request_dir = "artifacts/colab_autopilot/requests"
result_dir = "artifacts/colab_autopilot/results"
state_path = "artifacts/colab_autopilot/state.json"
default_status_backend = "none"
default_run_prefix = "autocolab"
poll_seconds = 30.0
default_job_timeout_minutes = 120.0
artifact_export_backend = "github_branch"
artifact_github_repo = "Stroudmj00/hex6-bot"
artifact_github_branch = "colab-autopilot-artifacts"
artifact_github_base_branch = "main"
artifact_github_dir = "colab_autopilot_exports"
research_backlog_path = "configs/colab_research_backlog.toml"
research_state_path = "artifacts/colab_autopilot/research_state.json"
research_note_dir = "artifacts/colab_autopilot/research_notes"
